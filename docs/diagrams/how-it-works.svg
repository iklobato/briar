<svg viewBox="0 0 1200 330" xmlns="http://www.w3.org/2000/svg" width="1200" height="330" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img">
  <title>How briar works: briar extract reads your tools and writes one facts file; briar serve reads that file, does a ticket and opens a pull request that you review and merge.</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cbc3d7"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="1199" height="329" rx="10" fill="#1a1a1a" stroke="#333"/>

  <text x="20" y="38" font-size="15" letter-spacing="1" fill="#cbc3d7">JOB 1: LEARN YOUR TEAM</text>
  <text x="740" y="38" font-size="15" letter-spacing="1" fill="#cbc3d7">JOB 2: DO THE TICKET</text>
  <line x1="20" y1="50" x2="690" y2="50" stroke="#8b5cf6" stroke-width="2"/>
  <line x1="740" y1="50" x2="1180" y2="50" stroke="#34d399" stroke-width="2"/>

  <rect x="20" y="80" width="210" height="190" rx="10" fill="#262626" stroke="#444"/>
  <text x="125" y="112" font-size="18" font-weight="600" text-anchor="middle" fill="#fff">Your tools</text>
  <text x="125" y="146" font-size="17" text-anchor="middle" fill="#e5e5e5">GitHub / GitLab</text>
  <text x="125" y="176" font-size="17" text-anchor="middle" fill="#e5e5e5">Jira / Linear</text>
  <text x="125" y="206" font-size="17" text-anchor="middle" fill="#e5e5e5">CI runs</text>
  <text x="125" y="236" font-size="17" text-anchor="middle" fill="#e5e5e5">Meeting notes</text>

  <line x1="234" y1="175" x2="282" y2="175" stroke="#cbc3d7" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="290" y="130" width="170" height="90" rx="10" fill="#4c1d95" stroke="#8b5cf6" stroke-width="2"/>
  <text x="375" y="168" font-size="20" font-weight="600" text-anchor="middle" fill="#fff">briar extract</text>
  <text x="375" y="196" font-size="16" text-anchor="middle" fill="#ddd6fe">reads. Free.</text>

  <line x1="464" y1="175" x2="512" y2="175" stroke="#cbc3d7" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="520" y="110" width="170" height="130" rx="10" fill="#262626" stroke="#8b5cf6" stroke-width="2"/>
  <text x="605" y="148" font-size="18" font-weight="600" text-anchor="middle" fill="#fff">Facts file</text>
  <text x="605" y="178" font-size="16" text-anchor="middle" fill="#e5e5e5">myteam.md</text>
  <text x="605" y="206" font-size="15" text-anchor="middle" fill="#a3a3a3">plain markdown</text>

  <line x1="694" y1="175" x2="742" y2="175" stroke="#cbc3d7" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="750" y="130" width="170" height="90" rx="10" fill="#064e3b" stroke="#34d399" stroke-width="2"/>
  <text x="835" y="168" font-size="20" font-weight="600" text-anchor="middle" fill="#fff">briar serve</text>
  <text x="835" y="196" font-size="16" text-anchor="middle" fill="#a7f3d0">plans and codes</text>

  <line x1="924" y1="175" x2="972" y2="175" stroke="#cbc3d7" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="980" y="110" width="200" height="130" rx="10" fill="#262626" stroke="#34d399" stroke-width="2"/>
  <text x="1080" y="148" font-size="18" font-weight="600" text-anchor="middle" fill="#fff">Pull request</text>
  <text x="1080" y="178" font-size="16" text-anchor="middle" fill="#e5e5e5">You review it</text>
  <text x="1080" y="206" font-size="16" text-anchor="middle" fill="#e5e5e5">You merge it</text>

  <text x="20" y="306" font-size="16" fill="#a3a3a3">Everything runs on your computer. No briar server, no account. briar never merges.</text>
</svg>
