<g><rect x="270" y="326" width="210" height="56" rx="8" stroke-width="1px" fill="rgb(10, 10, 10)" stroke="rgb(51, 51, 51)"/><text x="282" y="350" font-size="13px" fill="rgb(229, 226, 225)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">Change code</text><text x="282" y="366" font-size="11px" fill="rgb(203, 195, 215)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">and get a draft PR</text></g><g><g><path d="M 480 354 L 540 282" fill="none" marker-end="url(#picker-arrow)" stroke="rgb(203, 195, 215)" stroke-width="1px"/></g><rect x="540" y="262" width="560" height="40" rx="8" fill="rgb(10, 10, 10)" stroke="rgb(51, 51, 51)" stroke-width="1px"/><text x="554" y="286" font-size="12px" fill="rgb(229, 226, 225)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">One ticket</text><text x="760" y="286" font-size="11px" fill="rgb(139, 92, 246)" stroke="none" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="400">briar agent implement --ticket-key ACME-42</text></g><g><g><path d="M 480 354 L 540 330" fill="none" marker-end="url(#picker-arrow)" stroke="rgb(203, 195, 215)" stroke-width="1px"/></g><rect x="540" y="310" width="560" height="40" rx="8" fill="rgb(10, 10, 10)" stroke="rgb(51, 51, 51)" stroke-width="1px"/><text x="554" y="334" font-size="12px" fill="rgb(229, 226, 225)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">Comments on an open PR</text><text x="760" y="334" font-size="11px" fill="rgb(139, 92, 246)" stroke="none" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="400">briar agent prfix --pr 482 --branch fix/login</text></g><g><g><path d="M 480 354 L 540 378" fill="none" marker-end="url(#picker-arrow)" stroke="rgb(203, 195, 215)" stroke-width="1px"/></g><rect x="540" y="358" width="560" height="40" rx="8" fill="rgb(10, 10, 10)" stroke="rgb(51, 51, 51)" stroke-width="1px"/><text x="554" y="382" font-size="12px" fill="rgb(229, 226, 225)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">Plan a whole board</text><text x="760" y="382" font-size="11px" fill="rgb(139, 92, 246)" stroke="none" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="400">briar plan build jira:KAN --name q3</text></g><g><g><path d="M 480 354 L 540 426" fill="none" marker-end="url(#picker-arrow)" stroke="rgb(203, 195, 215)" stroke-width="1px"/></g><rect x="540" y="406" width="560" height="40" rx="8" fill="rgb(10, 10, 10)" stroke="rgb(51, 51, 51)" stroke-width="1px"/><text x="554" y="430" font-size="12px" fill="rgb(229, 226, 225)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">Work the plan, card by card</text><text x="760" y="430" font-size="11px" fill="rgb(139, 92, 246)" stroke="none" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="400">briar plan run q3 --llm anthropic</text></g></g><g><g><path d="M 210 342 L 270 536" fill="none" marker-end="url(#picker-arrow)" stroke="rgb(203, 195, 215)" stroke-width="1px"/></g><g><rect x="270" y="508" width="210" height="56" rx="8" stroke-width="1px" fill="rgb(10, 10, 10)" stroke="rgb(51, 51, 51)"/><text x="282" y="532" font-size="13px" fill="rgb(229, 226, 225)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">Check the setup</text><text x="282" y="548" font-size="11px" fill="rgb(203, 195, 215)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">or read back a run</text></g><g><g><path d="M 480 536 L 540 488" fill="none" marker-end="url(#picker-arrow)" stroke="rgb(203, 195, 215)" stroke-width="1px"/></g><rect x="540" y="468" width="560" height="40" rx="8" fill="rgb(10, 10, 10)" stroke="rgb(51, 51, 51)" stroke-width="1px"/><text x="554" y="492" font-size="12px" fill="rgb(229, 226, 225)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">First time in a repo</text><text x="760" y="492" font-size="11px" fill="rgb(139, 92, 246)" stroke="none" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="400">briar init · briar doctor</text></g><g><g><path d="M 480 536 L 540 536" fill="none" marker-end="url(#picker-arrow)" stroke="rgb(203, 195, 215)" stroke-width="1px"/></g><rect x="540" y="516" width="560" height="40" rx="8" fill="rgb(10, 10, 10)" stroke="rgb(51, 51, 51)" stroke-width="1px"/><text x="554" y="540" font-size="12px" fill="rgb(229, 226, 225)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">A credential is missing</text><text x="760" y="540" font-size="11px" fill="rgb(139, 92, 246)" stroke="none" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="400">briar secrets doctor</text></g><g><g><path d="M 480 536 L 540 584" fill="none" marker-end="url(#picker-arrow)" stroke="rgb(203, 195, 215)" stroke-width="1px"/></g><rect x="540" y="564" width="560" height="40" rx="8" fill="rgb(10, 10, 10)" stroke="rgb(51, 51, 51)" stroke-width="1px"/><text x="554" y="588" font-size="12px" fill="rgb(229, 226, 225)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">What did the plan do?</text><text x="760" y="588" font-size="11px" fill="rgb(139, 92, 246)" stroke="none" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="400">briar journal list --command plan</text></g></g></svg>
