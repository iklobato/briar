<svg viewBox="-16 -16 1152 668" xmlns="http://www.w3.org/2000/svg" width="1152" height="668" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title>A decision tree from what you need right now (understand, change code, check the setup) to the exact briar command for eleven common situations.</title><rect x="-15.5" y="-15.5" width="1151" height="667" rx="8" fill="rgb(26, 26, 26)" stroke="rgb(51, 51, 51)"/><defs><marker id="picker-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="rgb(203, 195, 215)" stroke="none"/></marker><marker id="picker-arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="rgb(139, 92, 246)" stroke="none"/></marker></defs><text x="20" y="36" font-size="11px" fill="rgb(203, 195, 215)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.55px">START HERE</text><text x="270" y="36" font-size="11px" fill="rgb(203, 195, 215)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.55px">WHAT YOU NEED</text><text x="540" y="36" font-size="11px" fill="rgb(203, 195, 215)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.55px">SITUATION</text><text x="760" y="36" font-size="11px" fill="rgb(203, 195, 215)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400" letter-spacing="0.55px">COMMAND</text><g><rect x="20" y="307" width="190" height="70" rx="8" stroke-width="1.5px" fill="rgb(10, 10, 10)" stroke="rgb(139, 92, 246)"/><text x="32" y="338" font-size="13px" fill="rgb(229, 22