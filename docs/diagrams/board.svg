<svg viewBox="-16 -16 1152 572" xmlns="http://www.w3.org/2000/svg" width="1152" height="572" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title>How briar plan run works a board: a selector picks the next card, replans, completes or stops; picked cards go to agent implement, and each success writes a lesson into the plan's knowledge that the selector reads next time.</title><rect x="-15.5" y="-15.5" width="1151" height="571" rx="8" fill="rgb(26, 26, 26)" stroke="rgb(51, 51, 51)"/><defs><marker id="plan-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="rgb(203, 195, 215)" stroke="none"/></marker><marker id="plan-arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="rgb(139, 92, 246)" stroke="none"/></marker></defs><g><rect x="20" y="150" width="220" height="100" rx="8" stroke-width="1px" fill="rgb(10, 10, 10)" stroke="rgb(51, 51, 51)"/><text x="32" y="180" font-size="13px" fill="rgb(229, 226, 225)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">plan build jira:KAN</text><text x="32" y="196" font-size="11px" fill="rgb(203, 195, 215)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">reads the board</text><text x="32" y="212" font-size="11px" fill="rgb(203, 195, 215)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">makes an ordered card list</text><text x="32" y="228" font-size="11px" fill="rgb(203, 195, 215)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">seeds knowledge:acme.q3</text></g><g><path d="M 240 200 L 320 200" fill="none" marker-end="url(#plan-arrow)" stroke="rgb(203, 195, 215)" stroke-width="1px"/><text x="280" y="192" font-size="11px" text-anchor="middle" fill="rgb(203, 195, 215)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">plan q3</text></g><text x="310" y="112" font-size="11px" text-anchor="end" fill="rgb(203, 195, 215)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400"><tspan x="310" dy="0">reads the plan,</tspan><tspan x="310" dy="14">knowledge, journal</tspan></text><g><polygon points="420,145 520,200 420,255 320,200" stroke-width="1.5px" fill="rgb(10, 10, 10)" stroke="rgb(139, 92, 246)"/><text x="420" y="197" font-size="11px" text-anchor="middle" fill="rgb(229, 226, 225)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">Selector (LLM)</text><text x="420" y="211" font-size="11px" text-anchor="middle" fill="rgb(229, 226, 225)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">what next?</text></g><g><path d="M 520 200 L 600 200" fill="none" marker-end="url(#plan-arrow-violet)" stroke="rgb(139, 92, 246)" stroke-width="1px"/><text x="560" y="192" font-size="11px" text-anchor="middle" fill="rgb(203, 195, 215)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">pick</text></g><g><rect x="600" y="160" width="240" height="80" rx="8" stroke-width="1.5px" fill="rgb(10, 10, 10)" stroke="rgb(139, 92, 246)"/><text x="612" y="188" font-size="13px" fill="rgb(229, 226, 225)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">agent implement</text><text x="612" y="204" font-size="11px" fill="rgb(203, 195, 215)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">the picked card's ticket</text><text x="612" y="220" font-size="11px" fill="rgb(203, 195, 215)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">on a branch like chore/kan-2</text></g><text x="720" y="262" font-size="11px" text-anchor="middle" fill="rgb(203, 195, 215)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400"><tspan x="720" dy="0">card: pending → in progress</tspan><tspan x="720" dy="14">→ done or blocked</tspan></text><g><path d="M 840 185 L 900 130" fill="none" marker-end="url(#plan-arrow)" stroke="rgb(203, 195, 215)" stroke-width="1px"/><text x="884" y="150" font-size="11px" text-anchor="end" fill="rgb(203, 195, 215)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">success</text></g><g><rect x="900" y="90" width="200" height="76" rx="8" stroke-width="1px" fill="rgb(10, 10, 10)" stroke="rgb(51, 51, 51)"/><text x="912" y="116" font-size="13px" fill="rgb(229, 226, 225)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">Done + lesson</text><text x="912" y="132" font-size="11px" fill="rgb(203, 195, 215)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">card marked done</text><text x="912" y="148" font-size="11px" fill="rgb(203, 195, 215)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">lesson → knowledge:acme.q3</text></g><g><path d="M 1000 90 L 1000 50 L 420 50 L 420 145" fill="none" marker-end="url(#plan-arrow-violet)" stroke="rgb(139, 92, 246)" stroke-width="1px"/><text x="710" y="42" font-size="11px" text-anchor="middle" fill="rgb(203, 195, 215)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">next decision</text></g><g><path d="M 840 215 L 900 272" fill="none" marker-end="url(#plan-arrow)" stroke="rgb(203, 195, 215)" stroke-width="1px"/><text x="884" y="262" font-size="11px" text-anchor="end" fill="rgb(203, 195, 215)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">failure</text></g><g><rect x="900" y="236" width="200" height="82" rx="8" stroke-width="1px" fill="rgb(10, 10, 10)" stroke="rgb(51, 51, 51)"/><text x="912" y="257" font-size="13px" fill="rgb(229, 226, 225)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">Card blocked</text><text x="912" y="273" font-size="11px" fill="rgb(203, 195, 215)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">run stops (default)</text><text x="912" y="289" font-size="11px" fill="rgb(203, 195, 215)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">--continue-on-failure:</text><text x="912" y="305" font-size="11px" fill="rgb(203, 195, 215)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">back to the selector</text></g><g><path d="M 400 255 L 400 330" fill="none" marker-end="url(#plan-arrow)" stroke="rgb(203, 195, 215)" stroke-width="1px"/><text x="392" y="296" font-size="11px" text-anchor="end" fill="rgb(203, 195, 215)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">replan</text></g><g><path d="M 440 330 L 440 255" fill="none" marker-end="url(#plan-arrow)" stroke="rgb(203, 195, 215)" stroke-width="1px"/></g><g><rect x="300" y="330" width="210" height="86" rx="8" stroke-width="1px" fill="rgb(10, 10, 10)" stroke="rgb(51, 51, 51)"/><text x="312" y="353" font-size="13px" fill="rgb(229, 226, 225)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">Replan</text><text x="312" y="369" font-size="11px" fill="rgb(203, 195, 215)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">re-read the board</text><text x="312" y="385" font-size="11px" fill="rgb(203, 195, 215)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">keep known card statuses</text><text x="312" y="401" font-size="11px" fill="rgb(203, 195, 215)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">max 3 (--max-replans)</text></g><g><path d="M 495 230 L 600 350" fill="none" marker-end="url(#plan-arrow)" stroke="rgb(203, 195, 215)" stroke-width="1px"/><text x="560" y="300" font-size="11px" text-anchor="start" fill="rgb(203, 195, 215)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">complete</text></g><g><rect x="600" y="330" width="170" height="56" rx="8" stroke-width="1px" fill="rgb(10, 10, 10)" stroke="rgb(51, 51, 51)"/><text x="612" y="354" font-size="13px" fill="rgb(229, 226, 225)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">Plan complete</text><text x="612" y="370" font-size="11px" fill="rgb(203, 195, 215)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">every card handled</text></g><g><path d="M 470 250 L 600 440" fill="none" marker-end="url(#plan-arrow)" stroke="rgb(203, 195, 215)" stroke-width="1px"/><text x="556" y="402" font-size="11px" text-anchor="end" fill="rgb(203, 195, 215)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">blocked</text></g><g><rect x="600" y="414" width="170" height="56" rx="8" stroke-width="1px" fill="rgb(10, 10, 10)" stroke="rgb(51, 51, 51)"/><text x="612" y="438" font-size="13px" fill="rgb(229, 226, 225)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">Stop: needs you</text><text x="612" y="454" font-size="11px" fill="rgb(203, 195, 215)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">no way forward</text></g><text x="710" y="68" font-size="11px" text-anchor="middle" fill="rgb(203, 195, 215)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400"><tspan x="710" dy="0">stops early after --limit N cards</tspan></text><rect x="20" y="486" width="1080" height="40" rx="8" fill="rgb(10, 10, 10)" stroke="rgb(51, 51, 51)" stroke-width="1px"/><text x="36" y="511" font-size="12px" fill="rgb(203, 195, 215)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">Every decision and card result is recorded:<!-- --> <tspan>briar journal list --command plan</tspan> · <tspan>briar journal show &lt;session-id&gt;</tspan></text></svg>
