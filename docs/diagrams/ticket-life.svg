<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" width="1200" height="300" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img">
  <title>The life of a ticket in briar serve: you assign an issue, briar posts a plan, the agent writes code in a safe copy, your checks run, a draft pull request opens and CI is watched, then you review and merge.</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cbc3d7"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="10" fill="#1a1a1a" stroke="#333"/>

  <g font-size="17" text-anchor="middle">
    <rect x="20" y="40" width="170" height="130" rx="10" fill="#064e3b" stroke="#34d399" stroke-width="2"/>
    <circle cx="105" cy="40" r="16" fill="#34d399"/><text x="105" y="46" font-size="17" font-weight="700" fill="#052e16">1</text>
    <text x="105" y="88" font-weight="600" fill="#fff">You assign</text>
    <text x="105" y="112" font-weight="600" fill="#fff">an issue</text>
    <text x="105" y="146" font-size="15" fill="#a7f3d0">to yourself</text>

    <rect x="216" y="40" width="170" height="130" rx="10" fill="#4c1d95" stroke="#8b5cf6" stroke-width="2"/>
    <circle cx="301" cy="40" r="16" fill="#8b5cf6"/><text x="301" y="46" font-size="17" font-weight="700" fill="#fff">2</text>
    <text x="301" y="88" font-weight="600" fill="#fff">briar posts</text>
    <text x="301" y="112" font-weight="600" fill="#fff">a plan</text>
    <text x="301" y="146" font-size="15" fill="#ddd6fe">as a comment</text>

    <rect x="412" y="40" width="170" height="130" rx="10" fill="#4c1d95" stroke="#8b5cf6" stroke-width="2"/>
    <circle cx="497" cy="40" r="16" fill="#8b5cf6"/><text x="497" y="46" font-size="17" font-weight="700" fill="#fff">3</text>
    <text x="497" y="88" font-weight="600" fill="#fff">The agent</text>
    <text x="497" y="112" font-weight="600" fill="#fff">writes code</text>
    <text x="497" y="146" font-size="15" fill="#ddd6fe">in a safe copy</text>

    <rect x="608" y="40" width="170" height="130" rx="10" fill="#4c1d95" stroke="#8b5cf6" stroke-width="2"/>
    <circle cx="693" cy="40" r="16" fill="#8b5cf6"/><text x="693" y="46" font-size="17" font-weight="700" fill="#fff">4</text>
    <text x="693" y="88" font-weight="600" fill="#fff">Your checks</text>
    <text x="693" y="112" font-weight="600" fill="#fff">run</text>
    <text x="693" y="146" font-size="15" fill="#ddd6fe">fixes what fails</text>

    <rect x="804" y="40" width="170" height="130" rx="10" fill="#4c1d95" stroke="#8b5cf6" stroke-width="2"/>
    <circle cx="889" cy="40" r="16" fill="#8b5cf6"/><text x="889" y="46" font-size="17" font-weight="700" fill="#fff">5</text>
    <text x="889" y="88" font-weight="600" fill="#fff">A draft PR</text>
    <text x="889" y="112" font-weight="600" fill="#fff">opens</text>
    <text x="889" y="146" font-size="15" fill="#ddd6fe">waits for CI</text>

    <rect x="1000" y="40" width="180" height="130" rx="10" fill="#064e3b" stroke="#34d399" stroke-width="2"/>
    <circle cx="1090" cy="40" r="16" fill="#34d399"/><text x="1090" y="46" font-size="17" font-weight="700" fill="#052e16">6</text>
    <text x="1090" y="88" font-weight="600" fill="#fff">You review</text>
    <text x="1090" y="112" font-weight="600" fill="#fff">and merge</text>
    <text x="1090" y="146" font-size="15" fill="#a7f3d0">briar never merges</text>
  </g>

  <g stroke="#cbc3d7" stroke-width="2.5" marker-end="url(#arrow)">
    <line x1="192" y1="105" x2="210" y2="105"/>
    <line x1="388" y1="105" x2="406" y2="105"/>
    <line x1="584" y1="105" x2="602" y2="105"/>
    <line x1="780" y1="105" x2="798" y2="105"/>
    <line x1="976" y1="105" x2="994" y2="105"/>
  </g>

  <path d="M 889 176 L 889 206 L 497 206 L 497 178" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="693" y="234" font-size="16" text-anchor="middle" fill="#fbbf24">CI or checks fail: the agent gets the log and tries again (up to max_loops)</text>

  <text x="20" y="282" font-size="16" fill="#a3a3a3">If it cannot finish, it stops and writes why on the ticket. It never picks that ticket up again by itself.</text>
</svg>
