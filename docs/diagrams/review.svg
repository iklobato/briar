<svg viewBox="-16 -16 1152 562" xmlns="http://www.w3.org/2000/svg" width="1152" height="562" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title>How briar agent prfix answers a review: skip a PR that is already approved and green, otherwise handle each open thread with a fix commit, a reply, or a note saying why, then push fast-forward and reply with the commit SHA.</title><rect x="-15.5" y="-15.5" width="1151" height="561" rx="8" fill="rgb(26, 26, 26)" stroke="rgb(51, 51, 51)"/><defs><marker id="prfix-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="rgb(203, 195, 215)" stroke="none"/></marker><marker id="prfix-arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="rgb(139, 92, 246)" stroke="none"/></marker></defs><g><rect x="20" y="60" width="190" height="60" rx="8" stroke-width="1px" fill="rgb(10, 10, 10)" stroke="rgb(51, 51, 51)"/><text x="32" y="86" font-size="13px" fill="rgb(229, 226, 225)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">Read the PR</text><text x="32" y="102" font-size="11px" fill="rgb(203, 195, 215)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">gh pr view: reviews, checks</text></g><g><path d="M 210 90 L 225 90" fill="none" marker-end="url(#prfix-arrow)" stroke="rgb(203, 195, 215)" stroke-width="1px"/></g><g><polygon points="325,32 425,90 325,148 225,90" stroke-width="1.5px" fill="rgb(10, 10, 10)" stroke="rgb(139, 92, 246)"/><text x="325" y="80" font-size="11px" text-anchor="middle" fill="rgb(229, 226, 225)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">Approved, checks</text><text x="325" y="94" font-size="11px" text-anchor="middle" fill="rgb(229, 226, 225)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">green, comments</text><text x="325" y="108" font-size="11px" text-anchor="middle" fill="rgb(229, 226, 225)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">all positive?</text></g><g><path d="M 325 148 L 325 190" fill="none" marker-end="url(#prfix-arrow)" stroke="rgb(203, 195, 215)" stroke-width="1px"/><text x="333" y="172" font-size="11px" text-anchor="start" fill="rgb(203, 195, 215)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">yes</text></g><g><rect x="235" y="190" width="180" height="56" rx="8" stroke-width="1px" fill="rgb(10, 10, 10)" stroke="rgb(51, 51, 51)"/><text x="247" y="214" font-size="13px" fill="rgb(229, 226, 225)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">Skip</text><text x="247" y="230" font-size="11px" fill="rgb(203, 195, 215)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">report 'skipped'</text></g><g><path d="M 425 90 L 460 90" fill="none" marker-end="url(#prfix-arrow)" stroke="rgb(203, 195, 215)" stroke-width="1px"/><text x="442" y="82" font-size="11px" text-anchor="middle" fill="rgb(203, 195, 215)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">no</text></g><g><rect x="460" y="60" width="210" height="60" rx="8" stroke-width="1px" fill="rgb(10, 10, 10)" stroke="rgb(51, 51, 51)"/><text x="472" y="86" font-size="13px" fill="rgb(229, 226, 225)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">List open threads</text><text x="472" y="102" font-size="11px" fill="rgb(203, 195, 215)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">inline threads + PR comments</text></g><rect x="440" y="150" width="450" height="270" rx="12" fill="none" stroke-dasharray="6 5" stroke="rgba(139, 92, 246, 0.6)" stroke-width="1px"/><text x="454" y="170" font-size="11px" text-anchor="start" fill="rgb(139, 92, 246)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400"><tspan x="454" dy="0">for each open thread</tspan></text><g><path d="M 565 120 L 565 185" fill="none" marker-end="url(#prfix-arrow)" stroke="rgb(203, 195, 215)" stroke-width="1px"/></g><g><polygon points="565,185 665,230 565,275 465,230" stroke-width="1.5px" fill="rgb(10, 10, 10)" stroke="rgb(139, 92, 246)"/><text x="565" y="227" font-size="11px" text-anchor="middle" fill="rgb(229, 226, 225)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">Asks for a</text><text x="565" y="241" font-size="11px" text-anchor="middle" fill="rgb(229, 226, 225)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">code change?</text></g><g><path d="M 665 230 L 700 230" fill="none" marker-end="url(#prfix-arrow)" stroke="rgb(203, 195, 215)" stroke-width="1px"/><text x="682" y="222" font-size="11px" text-anchor="middle" fill="rgb(203, 195, 215)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">yes</text></g><g><rect x="700" y="196" width="175" height="68" rx="8" stroke-width="1px" fill="rgb(10, 10, 10)" stroke="rgb(51, 51, 51)"/><text x="712" y="218" font-size="13px" fill="rgb(229, 226, 225)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">Fix and commit</text><text x="712" y="234" font-size="11px" fill="rgb(203, 195, 215)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">smallest fix, one commit</text><text x="712" y="250" font-size="11px" fill="rgb(203, 195, 215)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">cites the comment id</text></g><g><path d="M 565 275 L 565 330" fill="none" marker-end="url(#prfix-arrow)" stroke="rgb(203, 195, 215)" stroke-width="1px"/><text x="573" y="300" font-size="11px" text-anchor="start" fill="rgb(203, 195, 215)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">no: a question</text></g><text x="573" y="314" font-size="11px" text-anchor="start" fill="rgb(203, 195, 215)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400"><tspan x="573" dy="0">or an opinion</tspan></text><g><rect x="475" y="330" width="180" height="60" rx="8" stroke-width="1px" fill="rgb(10, 10, 10)" stroke="rgb(51, 51, 51)"/><text x="487" y="356" font-size="13px" fill="rgb(229, 226, 225)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">Reply, no commit</text><text x="487" y="372" font-size="11px" fill="rgb(203, 195, 215)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">clarify in the thread</text></g><g><path d="M 787 264 L 787 330" fill="none" marker-end="url(#prfix-arrow)" stroke="rgb(203, 195, 215)" stroke-width="1px"/><text x="795" y="300" font-size="11px" text-anchor="start" fill="rgb(203, 195, 215)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">not safe</text></g><g><rect x="700" y="330" width="175" height="60" rx="8" stroke-width="1px" fill="rgb(10, 10, 10)" stroke="rgb(51, 51, 51)"/><text x="712" y="356" font-size="13px" fill="rgb(229, 226, 225)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">Comment, skip</text><text x="712" y="372" font-size="11px" fill="rgb(203, 195, 215)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">says why it can't fix</text></g><g><path d="M 875 230 L 920 230" fill="none" marker-end="url(#prfix-arrow)" stroke="rgb(203, 195, 215)" stroke-width="1px"/><text x="898" y="222" font-size="11px" text-anchor="middle" fill="rgb(203, 195, 215)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">then</text></g><g><rect x="920" y="196" width="180" height="68" rx="8" stroke-width="1.5px" fill="rgb(10, 10, 10)" stroke="rgb(139, 92, 246)"/><text x="932" y="218" font-size="13px" fill="rgb(229, 226, 225)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">Push</text><text x="932" y="234" font-size="11px" fill="rgb(203, 195, 215)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">fast-forward only</text><text x="932" y="250" font-size="11px" fill="rgb(203, 195, 215)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">to the PR branch</text></g><g><path d="M 1010 264 L 1010 300" fill="none" marker-end="url(#prfix-arrow)" stroke="rgb(203, 195, 215)" stroke-width="1px"/></g><g><rect x="920" y="300" width="180" height="60" rx="8" stroke-width="1px" fill="rgb(10, 10, 10)" stroke="rgb(51, 51, 51)"/><text x="932" y="326" font-size="13px" fill="rgb(229, 226, 225)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">Reply with the SHA</text><text x="932" y="342" font-size="11px" fill="rgb(203, 195, 215)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">on each fixed thread</text></g><g><path d="M 1010 360 L 1010 396" fill="none" marker-end="url(#prfix-arrow)" stroke="rgb(203, 195, 215)" stroke-width="1px"/></g><g><rect x="920" y="396" width="180" height="56" rx="8" stroke-width="1px" fill="rgb(10, 10, 10)" stroke="rgb(51, 51, 51)"/><text x="932" y="420" font-size="13px" fill="rgb(229, 226, 225)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">Summary, stop</text><text x="932" y="436" font-size="11px" fill="rgb(203, 195, 215)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400">commits + replies</text></g><rect x="20" y="470" width="1080" height="44" rx="8" fill="rgb(10, 10, 10)" stroke="rgb(139, 92, 246)" stroke-width="1px"/><text x="36" y="497" font-size="12px" fill="rgb(229, 226, 225)" stroke="none" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400"><tspan>Never: </tspan>--force, --amend, rebase, squash or filter-branch · commit as a bot identity · touch files outside the PR's diff unless the fix needs it</text></svg>
